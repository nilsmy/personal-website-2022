<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizzes</title>
  <style>
    :root{font-family:Arial,Helvetica,sans-serif;color:#444;background:#fff}

    .choices{display:grid;gap:12px}.choice{width:100%;text-align:left;border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:16px 18px;color:#444;font-size:1.12rem}
    .choice:hover,.choice:focus-visible{border-color:#2876a6;outline:2px solid #2876a644}.choice[disabled]{cursor:default}
    .choice.correct{border-color:#39834e;background:#e6f4e9}.choice.wrong{border-color:#b65151;background:#faeaea}.choice.selected{border-color:#2876a6;background:#e8f2fa}
    .choice strong{display:inline-grid;place-items:center;background:#f0f0f0;border-radius:5px;width:34px;height:34px;margin-right:14px}
    .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.primary{border:0;border-radius:5px;background:#2876a6;color:#fff;padding:13px 22px;font-weight:700}.primary:hover:not(:disabled){background:#1d5e89}.primary:disabled{opacity:.48;cursor:default}
    button.primary,button.secondary,label.secondary{display:inline-flex;align-items:center;justify-content:center;gap:9px}
    .icon{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .secondary{border:1px solid #b9b9b9;border-radius:5px;background:#fff;color:#444;padding:12px 18px}.secondary:hover:not(:disabled){border-color:#2876a6;color:#205f87}

    progress{width:100%;height:15px;accent-color:#2876a6}progress::-webkit-progress-bar{background:#fff;border-radius:10px}progress::-webkit-progress-value{background:#2876a6;border-radius:10px}
    small{color:#777}#setup label{display:block;margin:18px 0 7px;font-weight:600}#setup label.toolbar{display:flex;align-items:center;gap:10px}#setup label[for=loadQuiz]{margin:0;font-weight:normal}
    select,input[type=text]{width:100%;padding:12px;border:1px solid #b9b9b9;border-radius:5px;background:#fff;color:#444}
    input[type=checkbox]{width:19px;height:19px;accent-color:#2876a6}.footer{margin-top:24px}.stats{display:flex;justify-content:space-between;gap:8px;font-size:1.1rem;margin-bottom:12px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:14px;border-radius:5px}a{color:#2876a6}
    .skill-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px}.status-badge{display:inline-block;border-radius:999px;padding:6px 11px;font-weight:700;font-size:.9rem}.status-acquise{background:#e2f2e6;color:#24633a}.status-en-cours{background:#fff0ce;color:#775314}.status-pas-testee{background:#e7e7e7;color:#555}.status-note{color:#666;font-size:.94rem}

    <button id="next" class="primary footer hidden"><svg class="icon" aria-hidden="true"><use href="#i-next"/></svg><span id="nextLabel">Question suivante</span></button>
    <button id="cancel" class="secondary footer"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>Annuler le quiz</button>
  </section>
  <section id="result" class="card hidden"><h2>Défi terminé !</h2><p id="summary"></p><div id="breakdown"></div><div class="toolbar"><button id="email" class="primary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Envoyer par e-mail</button><button id="saveFolder" class="secondary"><svg class="icon" aria-hidden="true"><use href="#i-save"/></svg>Enregistrer dans un dossier…</button><button id="download" class="secondary"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>Télécharger le rapport JSON</button><button id="copy" class="secondary"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg>Copier le rapport</button><button id="again" class="secondary"><svg class="icon" aria-hidden="true"><use href="#i-repeat"/></svg>Recommencer</button></div><p id="copyStatus" role="status"></p><details><summary>Voir le rapport</summary><pre id="report"></pre></details></section>

function extraChoice(right,wrong,i){
  const unique=[String(right),...wrong.map(String)].filter((v,j,a)=>a.indexOf(v)===j).slice(0,4);
  if(unique.length!==4)throw Error(`Choix insuffisants pour ${right} (${i}).`);
  const answer=i%4;unique.splice(0,1);unique.splice(answer,0,String(right));
  return {choices:unique,answer};
}
function extraNumber(right,wrong,i){
  const candidates=[...wrong,right+1,right-1,right+2,right-2,right+10,right-10].filter(x=>Number.isInteger(x)&&x>=0&&x!==right);
  return extraChoice(right,candidates,i);
}

    if(i%2){prompt=`${a} + □ = ${a+b}. Quel nombre manque ?`;correct=b;wrong=[a,b+1,b-1];explanation=`${a+b} − ${a} = ${b}.`;skill='Terme manquant';}
    else {prompt=`Combien font ${a} + ${b} ?`;correct=a+b;wrong=[a+b+1,a+b-1,a+b+2];explanation=`${a} + ${b} = ${correct}.`;skill='Fait additif';}
  }else if(id==='MA-M02'){
    const a=2+(i*3+Math.floor(i/18))%9,b=2+(i*7)%9;
    if(i%2){prompt=`${a} × □ = ${a*b}. Quel facteur manque ?`;correct=b;wrong=[a,b+1,b-1];explanation=`${a} × ${b} = ${a*b}.`;skill='Facteur manquant';}
    else {prompt=`Combien font ${a} × ${b} ?`;correct=a*b;wrong=[a*(b+1),a*b+a,a*b-1];explanation=`${a} × ${b} = ${correct}.`;skill='Fait multiplicatif';}
  }else if(id==='MA-M03'){
    const order=ce2?Math.floor((i-12)/3):Math.floor(i/3);
    if(i%3===0){const n=(ce2?[13,18,35]:[4,7,9,20])[order];prompt=`Quel est le double de ${n} ?`;correct=2*n;wrong=[n+2,2*n+2,2*n-2];explanation=`${n} + ${n} = ${correct}.`;skill='Double';}
    else if(i%3===1){const value=(ce2?[24,30,120]:[12,16,80,100])[order],n=value/2;prompt=`Quelle est la moitié de ${value} ?`;correct=n;wrong=[n+1,n-1,value];explanation=`Deux parts de ${n} font ${value}.`;skill='Moitié';}
    else {const v=[25,50,75,100][i%4];prompt=ce2?`Quel est le résultat de 25 × ${i%4+1} ?`:`Combien font ${i%4+1} groupes de 25 ?`;correct=v;wrong=[v+25,Math.max(0,v-25),v+10];explanation=`${i%4+1} groupes de 25 donnent ${v}.`;skill='Multiples de 25';}
  }else if(id==='MA-M04'){
    const step=ce2&&i%2===0?100:10,a=(ce2?20:3)*step+((i*7)%9)*step+3+(i%6),delta=(1+i%4)*step,subtract=i%3===0;
    prompt=`Combien font ${a} ${subtract?'−':'+'} ${delta} ?`;correct=a+(subtract?-delta:delta);
    wrong=[correct+step,correct-step,correct+(subtract?delta:-delta)];explanation=`On ${subtract?'retire':'ajoute'} ${delta/step} ${step===100?'centaines':'dizaines'} : ${correct}.`;skill='Numération et calcul';
  }else if(id==='MA-M05'){
    const n=3+(i*7)%(ce2?87:86),factor=ce2&&i%2===0?100:10;

function readingQuestions(id){
  const bank=readingBanks[id];if(!bank||bank.items.length!==10)throw Error(`Banque de lecture incomplète : ${id}`);
  return bank.items.map(([story,skill,prompt,correct,w1,w2,w3,explanation],i)=>({
    level:i<5?'CE1':'CE2',skill,subskillId:`${id}-${skill.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'-')}`,
    programmeSkills:[id],passageId:`${id}-${story}`,passage:bank.stories[story],prompt,...extraChoice(correct,[w1,w2,w3],i),explanation
  }));
}
function extraQuestions(id,count){
  if(id.startsWith('QLM-'))return qlmQuestions(id);
  if(id.startsWith('FR-L'))return readingQuestions(id);
  const all=Array.from({length:20},(_,i)=>advancedIds.has(id)?advancedQuestion(id,i):visualMathIds.has(id)?visualMathQuestion(id,i):additionalMathIds.has(id)?additionalMathQuestion(id,i):extraQuestion(id,i));
  if(count===10&&id==='FR-G09-IRREG')return [0,1,2,3,4,5,6,7,12,19].map(i=>all[i]);
  if(count===10&&id==='FR-V04')return [0,1,4,6,8,9,12,14,16,18].map(i=>all[i]);
  return count===10?[...all.slice(0,6),...all.slice(12,16)]:all;
}

const advancedIds=new Set(['MA-Q07','MA-G01','MA-G04','MA-G07','FR-G09-IRREG','FR-V04']);
function advancedQuestion(id,i){
  const ce2=i>=12,level=['MA-G07','FR-G09-IRREG'].includes(id)||ce2?'CE2':'CE1';
  let prompt,correct,wrong,explanation,skill,visual;
  if(id==='MA-Q07'){
    const ce1Prices=[115,230,345,405,270,155,325,480,215,365,125,440];
    const ce2Prices=[565,725,830,945,675,790,615,875];
    const price=ce2?ce2Prices[i-12]:ce1Prices[i],paid=ce2?1000:500;
    const euros=n=>Math.floor(n/100)+','+String(n%100).padStart(2,'0')+' €';
    visual={kind:'money',price,paid};
    prompt='Un objet coûte '+euros(price)+'. Tu paies avec '+euros(paid)+'. Combien doit-on te rendre ?';
    correct=euros(paid-price);
    wrong=[euros(paid-price+10),euros(paid-price-10),euros(paid-price+100)];
    explanation=euros(paid)+' − '+euros(price)+' = '+correct+'.';
    skill=ce2?'Rendre la monnaie avec 10 €':'Rendre la monnaie avec 5 €';
  }else if(id==='MA-G01'){
    const shapes=['cube','pave','boule','cone','pyramide','cylindre','cube','pave','pyramide','boule','cylindre','cone','cube','pave','pyramide','cylindre','cone','boule','pyramide','cube'];
    const shape=shapes[i],names={cube:'Un cube',pave:'Un pavé droit',boule:'Une boule',cone:'Un cône',pyramide:'Une pyramide à base carrée',cylindre:'Un cylindre'};
    visual={kind:'solid',shape};
    if(i%3===1&&['cube','pave','pyramide'].includes(shape)){
      prompt='Combien de sommets possède ce solide ?';correct=shape==='pyramide'?5:8;wrong=[4,6,12,8,5].filter(n=>n!==correct).slice(0,3);
      explanation=shape==='pyramide'?'Cette pyramide à base carrée a quatre sommets sur sa base et un sommet en haut.':'Le cube et le pavé droit possèdent chacun huit sommets.';
      skill='Compter les sommets';
    }else if(i%3===2&&['cube','pave','pyramide'].includes(shape)){
      prompt='Combien de faces possède ce solide ?';correct=shape==='pyramide'?5:6;wrong=[4,8,12,6,5].filter(n=>n!==correct).slice(0,3);
      explanation=shape==='pyramide'?'Une base carrée et quatre faces triangulaires font cinq faces.':'Le cube et le pavé droit possèdent chacun six faces.';
      skill='Compter les faces';
    }else{
      prompt='Quel est le nom de ce solide ?';correct=names[shape];
      wrong=Object.values(names).filter(name=>name!==correct).slice(i%3,i%3+3);
      if(wrong.length<3)wrong=Object.values(names).filter(name=>name!==correct).slice(0,3);
      explanation='Ce solide est '+correct.toLowerCase()+'.';skill='Nommer un solide';
    }
  }else if(id==='MA-G04'){
    const part=ce2?['rayon','diametre','diagonale','rayon','diametre','diagonale','rayon','diametre'][i-12]:['cote','sommet','angle','cote','sommet','angle','cote','sommet','angle','cote','sommet','angle'][i];
    visual={kind:'geometryPart',part,variant:i};
    prompt='Comment appelle-t-on la partie dorée de cette figure ?';
    const labels={cote:'Un côté',sommet:'Un sommet',angle:'Un angle',rayon:'Un rayon',diametre:'Un diamètre',diagonale:'Une diagonale'};
    correct=labels[part];wrong=Object.values(labels).filter(x=>x!==correct).slice(ce2?2:0,ce2?5:3);
    if(wrong.length<3)wrong=Object.values(labels).filter(x=>x!==correct).slice(0,3);
    const meanings={cote:'Un côté est un segment du contour de la figure.',sommet:'Un sommet est un point où deux côtés se rejoignent.',angle:'Un angle est formé par deux côtés qui se rencontrent.',rayon:'Un rayon va du centre du cercle à un point du cercle.',diametre:'Un diamètre relie deux points du cercle en passant par son centre.',diagonale:'Une diagonale relie deux sommets non voisins.'};
    explanation=meanings[part];skill='Identifier '+labels[part].toLowerCase();
  }else if(id==='MA-G07'){
    const mode=i%4,bases=[
      [[0,0],[0,1],[1,1],[1,3],[2,4]],
      [[0,2],[1,0],[1,1],[2,1],[2,5]],
      [[0,5],[0,4],[1,3],[2,2],[2,0]],
      [[0,3],[1,5],[1,2],[2,1],[2,0]],
      [[0,1],[0,2],[1,4],[2,0],[2,3]]
    ],base=bases[Math.floor(i/4)];
    const cells=mode===3?base:base.flatMap(([x,y])=>mode===0?[[x,y],[5-x,y]]:mode===1?[[x,y],[x,5-y]]:[[x,y],[y,x]]);
    visual={kind:'symmetry',cells:[...new Map(cells.map(([x,y])=>[x+','+y,[x,y]])).values()]};
    prompt='Quel axe de symétrie cette figure possède-t-elle ?';
    const answers=['Un axe vertical','Un axe horizontal','Une diagonale','Aucun de ces axes'];
    correct=answers[mode];wrong=answers.filter(x=>x!==correct);
    explanation=mode===3?'Aucun des axes proposés ne partage cette figure en deux parties superposables.':'En pliant sur '+['l’axe vertical','l’axe horizontal','la diagonale'][mode]+', les cases colorées se superposent.';
    skill=['Axe vertical','Axe horizontal','Axe diagonal','Absence d’axe'][mode];
  }else if(id==='FR-G09-IRREG'){
    const forms={
      faire:['fais','fais','fait','faisons','faites','font'],
      aller:['vais','vas','va','allons','allez','vont'],
      dire:['dis','dis','dit','disons','dites','disent'],
      venir:['viens','viens','vient','venons','venez','viennent'],
      pouvoir:['peux','peux','peut','pouvons','pouvez','peuvent'],
      voir:['vois','vois','voit','voyons','voyez','voient'],
      vouloir:['veux','veux','veut','voulons','voulez','veulent'],
      prendre:['prends','prends','prend','prenons','prenez','prennent']
    };
    const bank=[
      ['faire',0,'Je','un dessin pour le livre.'],['aller',1,'Tu','à la bibliothèque.'],
      ['dire',5,'Les enfants','bonjour à leur voisine.'],['venir',3,'Nous','chez nos grands-parents.'],
      ['pouvoir',2,'Elle','ouvrir la fenêtre.'],['voir',4,'Vous','les étoiles ce soir.'],
      ['vouloir',5,'Ils','finir cette partie.'],['prendre',2,'Mon frère','le train demain.'],
      ['faire',3,'Nous','une expérience.'],['aller',5,'Mes cousins','au musée.'],
      ['dire',2,'Le guide','le nom de la plante.'],['venir',1,'Tu','avec moi au parc.'],
      ['pouvoir',4,'Vous','comparer les deux cartes.'],['voir',0,'Je','un oiseau sur la branche.'],
      ['vouloir',2,'La chercheuse','vérifier son idée.'],['prendre',3,'Nous','nos carnets pour noter.'],
      ['faire',5,'Les élèves','un plan du quartier.'],['venir',2,'Ma grand-mère','nous voir dimanche.'],
      ['voir',5,'Les randonneurs','la montagne au loin.'],['prendre',4,'Vous','la route vers le village.']
    ];
    const [verb,person,subject,rest]=bank[i];
    prompt=subject+' ___ '+rest;correct=forms[verb][person];
    wrong=[...new Set(forms[verb])].filter(x=>x!==correct).slice(0,3);
    explanation='Au présent, avec « '+subject+' », le verbe '+verb+' s’écrit « '+correct+' » : '+subject+' '+correct+' '+rest;
    skill='Présent '+(verb==='aller'?"d’aller":'de '+verb);
  }else if(id==='FR-V04'){
    const words=[
      {familier:'bagnole',courant:'voiture',soutenu:'automobile',autre:'bicyclette'},
      {familier:'bouquin',courant:'livre',soutenu:'ouvrage',autre:'journal'},
      {familier:'baraque',courant:'maison',soutenu:'demeure',autre:'cabane'},
      {familier:'bouffer',courant:'manger',soutenu:'se restaurer',autre:'dormir'},
      {familier:'flic',courant:'policier',soutenu:'fonctionnaire de police',autre:'pompier'}
    ];
    const set=words[Math.floor(i/4)],mode=i%4;
    if(mode===0){prompt='Quel mot est familier ?';correct=set.familier;skill='Reconnaître le registre familier';}
    else if(mode===1){prompt='Quel mot appartient au registre courant ?';correct=set.courant;skill='Reconnaître le registre courant';}
    else if(mode===2){prompt='Quel mot ou expression est le plus soutenu parmi ces propositions ?';correct=set.soutenu;skill='Comparer les registres';}
    else {prompt='Pour remplacer « '+set.familier+' » dans un texte au registre courant, que choisir ?';correct=set.courant;skill='Passer au registre courant';}
    wrong=[set.familier,set.courant,set.soutenu,set.autre].filter(x=>x!==correct);
    explanation='« '+set.familier+' » est familier ; « '+set.courant+' » est courant ; « '+set.soutenu+' » est plus soutenu dans ce groupe de mots.';
  }else throw Error('Unité avancée inconnue : '+id);
  const choices=typeof correct==='number'?extraNumber(correct,wrong,i):extraChoice(correct,wrong,i);
  const key=skill.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]+/g,'-');
  return {level,skill,subskillId:id+'-'+key,programmeSkills:[id.split('-IRREG')[0]],prompt,...choices,explanation,...(visual?{visual}:{})};
}

    add('text',{x:205,y:137,'text-anchor':'middle','font-size':37,'font-weight':'bold',fill:'#333'},euros(visual.price));
    add('rect',{x:385,y:35,width:250,height:150,rx:15,fill:'#dbe8dc',stroke:'#336348','stroke-width':4});
    add('circle',{cx:510,cy:110,r:48,fill:'none',stroke:'#336348','stroke-width':2});
    add('text',{x:510,y:96,'text-anchor':'middle','font-size':16,fill:'#336348'},'BILLET');
    add('text',{x:510,y:130,'text-anchor':'middle','font-size':32,'font-weight':'bold',fill:'#336348'},euros(visual.paid));
  }else if(visual.kind==='solid'){
    svg.setAttribute('viewBox','0 0 720 260');svg.setAttribute('aria-label','Dessin d’un solide');
    const ink={fill:'#f8edcf',stroke:'#333','stroke-width':4,'stroke-linejoin':'round'};
    if(visual.shape==='cube'||visual.shape==='pave'){
      const square=visual.shape==='cube',x=square?300:245,y=square?75:85,w=square?135:230,h=square?135:115,d=40;
      add('polygon',{points:(x+','+y+' '+(x+d)+','+(y-d)+' '+(x+w+d)+','+(y-d)+' '+(x+w)+','+y),...ink});
      add('polygon',{points:((x+w)+','+y+' '+(x+w+d)+','+(y-d)+' '+(x+w+d)+','+(y+h-d)+' '+(x+w)+','+(y+h)),...ink});
      add('rect',{x,y,width:w,height:h,...ink});
    }else if(visual.shape==='pyramide'){
      add('polygon',{points:'215,190 500,190 445,222 275,222',...ink});
      add('polygon',{points:'360,30 215,190 275,222',...ink});
      add('polygon',{points:'360,30 275,222 445,222',...ink});
      add('polygon',{points:'360,30 445,222 500,190',...ink});
    }else if(visual.shape==='cylindre'){
      add('path',{d:'M 280 72 L 280 190 A 80 23 0 0 0 440 190 L 440 72 Z',...ink});
      add('ellipse',{cx:360,cy:72,rx:80,ry:23,...ink});
    }else if(visual.shape==='cone'){
      add('path',{d:'M 360 35 L 265 200 A 95 25 0 0 0 455 200 Z',...ink});
      add('ellipse',{cx:360,cy:200,rx:95,ry:25,fill:'none',stroke:'#333','stroke-width':3});
    }else if(visual.shape==='boule'){
      add('circle',{cx:360,cy:130,r:95,...ink});
      add('ellipse',{cx:360,cy:130,rx:95,ry:32,fill:'none',stroke:'#b58a23','stroke-width':2});
    }
  }else if(visual.kind==='geometryPart'){
    svg.setAttribute('viewBox','0 0 720 240');svg.setAttribute('aria-label','Figure avec une partie dorée');
    const gold='#b58a23';
    if(visual.part==='rayon'||visual.part==='diametre'){
      add('circle',{cx:360,cy:120,r:85,fill:'none',stroke:'#333','stroke-width':4});
      add('circle',{cx:360,cy:120,r:5,fill:'#333'});
      const angle=(visual.variant%4)*Math.PI/4,dx=85*Math.cos(angle),dy=85*Math.sin(angle);
      if(visual.part==='rayon')add('line',{x1:360,y1:120,x2:360+dx,y2:120+dy,stroke:gold,'stroke-width':8});

      const points=visual.part==='diagonale'?shapes[0]:shapes[visual.variant%4],a=points[0],b=points[1],last=points[points.length-1];
      add('polygon',{points:points.map(p=>p.join(',')).join(' '),fill:'#fff',stroke:'#333','stroke-width':4});

      else if(visual.part==='angle'){const q1=[a[0]+(b[0]-a[0])*.2,a[1]+(b[1]-a[1])*.2],q2=[a[0]+(last[0]-a[0])*.2,a[1]+(last[1]-a[1])*.2];add('path',{d:'M '+q1.join(' ')+' L '+a.join(' ')+' L '+q2.join(' '),fill:'none',stroke:gold,'stroke-width':7});}
      else add('line',{x1:points[0][0],y1:points[0][1],x2:points[2][0],y2:points[2][1],stroke:gold,'stroke-width':8});
    }

    for(let y=0;y<6;y++)for(let x=0;x<6;x++)add('rect',{x:x0+x*size,y:y0+y*size,width:size,height:size,fill:filled.has(x+','+y)?'#b58a23':'#fff',stroke:'#777','stroke-width':1});
  }else throw Error(`Diagramme inconnu : ${visual.kind}`);
  svg.setAttribute('role','img');host.append(svg);
}
function render(){
  const q=quiz.questions[index]; answered=false;selectedChoice=undefined;
  $('position').textContent=`${quiz.id} · ${q.level||''} · Question ${index+1}/${quiz.questions.length}`;
  $('score').textContent=immediateFeedback?`${responses.filter(r=>r.correct).length}/${responses.length} juste(s)`:'';
  $('progress').max=quiz.questions.length;$('progress').value=index;
  $('passage').classList.toggle('hidden',!q.passage);$('passage').textContent=q.passage||'';
  $('question').textContent=q.prompt;drawAxis(q.axis);drawFraction(q.figure);drawVisual(q.visual);$('choices').replaceChildren();
  const written=q.format==='written';$('choices').classList.toggle('hidden',written);$('writtenAnswer').classList.toggle('hidden',!written);$('textAnswer').value='';$('textAnswer').disabled=false;
  if(!written)q.choices.forEach((choice,i)=>{const b=document.createElement('button');b.className='choice';b.type='button';b.setAttribute('aria-pressed','false');b.innerHTML=`<strong>${'ABCD'[i]}</strong>`;b.append(document.createTextNode(choice));b.addEventListener('click',()=>select(i));$('choices').append(b)});
  $('unknown').disabled=false;$('unknown').classList.remove('selected');$('unknown').setAttribute('aria-pressed','false');$('confirm').disabled=true;$('confirm').classList.remove('hidden');$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('nextLabel').textContent=index===quiz.questions.length-1?'Voir le résultat':'Question suivante';
}
function select(choice){
  if(answered)return;selectedChoice=choice;if(quiz.questions[index].format==='written'&&choice===null)$('textAnswer').value='';
  [...$('choices').children].forEach((b,i)=>{b.classList.toggle('selected',i===choice);b.setAttribute('aria-pressed',String(i===choice))});
  $('unknown').classList.toggle('selected',choice===null);$('unknown').setAttribute('aria-pressed',String(choice===null));$('confirm').disabled=false;
}
function submit(){
  if(answered||selectedChoice===undefined)return;answered=true;const choice=selectedChoice,q=quiz.questions[index],written=q.format==='written',correct=written?choice!==null&&q.accepted.some(expected=>normalizeWrittenAnswer(choice)===normalizeWrittenAnswer(expected)):choice===q.answer;
  playSound('answer');
  responses.push({number:index+1,format:written?'written':'qcm',level:q.level||null,skill:q.skill||null,subskillId:q.subskillId||null,programmeSkills:q.programmeSkills||null,prompt:q.prompt,passageId:q.passageId||null,axis:q.axis||null,figure:q.figure||null,visual:q.visual||null,choices:written?null:q.choices,selectedIndex:written?null:choice,selected:choice===null?null:written?choice:q.choices[choice],correctIndex:written?null:q.answer,correctAnswer:written?q.expected:q.choices[q.answer],correct,unknown:choice===null,reviewNeeded:written&&!correct&&choice!==null,explanation:q.explanation,assistance:'non renseignée'});
  if(written)$('textAnswer').disabled=true;
  [...$('choices').children].forEach((b,i)=>{b.disabled=true;if(immediateFeedback){b.classList.remove('selected');if(i===q.answer)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')}});$('unknown').disabled=true;
  if(immediateFeedback){$('feedback').textContent=(correct?'Bravo ! ':choice===null?'À retenir : ':written?'Réponse à revoir : ':'Regardons la règle : ')+q.explanation;$('feedback').classList.remove('hidden');$('score').textContent=`${responses.filter(r=>r.correct).length}/${responses.length} juste(s)`;}
  $('confirm').classList.add('hidden');$('next').classList.remove('hidden');$('progress').value=index+1;
}
function report(){const bySubskill={},passages={};for(const q of quiz.questions)if(q.passageId&&q.passage)passages[q.passageId]=q.passage;for(const r of responses){if(r.subskillId){bySubskill[r.subskillId]??={correct:0,total:0,unknown:0};bySubskill[r.subskillId].total++;if(r.correct)bySubskill[r.subskillId].correct++;if(r.unknown)bySubskill[r.subskillId].unknown++;}}return {schema:'education-quiz-v1',quizId:quiz.id,quizTitle:quiz.title,subject:quiz.subject||'Autres',language:quiz.language||'fr-FR',source:quiz.source||null,levels:quiz.levels||null,responseFormat:quiz.responseFormat||'qcm',quizStatusAtStart:effectiveStatus(quiz),quizStatusScope:Object.hasOwn(statusOverrides,quiz.id)?null:quiz.statusScope||null,quizStatusBasis:Object.hasOwn(statusOverrides,quiz.id)?'Statut choisi sur cet appareil.':quiz.statusBasis||null,dateLocal:localDate(),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone||null,immediateFeedback,soundEnabled,startedAt,completedAt:new Date().toISOString(),initialCorrect:responses.filter(r=>r.correct).length,total:responses.length,unknown:responses.filter(r=>r.unknown).length,writtenReviewNeeded:responses.filter(r=>r.reviewNeeded).length,bySubskill,...(Object.keys(passages).length?{passages}:{}),assistance:'non renseignée',interpretation:quiz.responseFormat==='written'?'Réponses écrites initiales comparées aux formes attendues ; les écarts restent à examiner, sans conclusion de maîtrise générale.':'QCM d’apprentissage ; réponses initiales observées, sans conclusion de maîtrise générale.',responses};}
function finish(){playSound('finish');show('result');const data=report();$('summary').textContent=`${data.initialCorrect}/${data.total} réponses initiales ${data.responseFormat==='written'?'exactes':'correctes'}. ${data.unknown} « je ne sais pas ». ${data.writtenReviewNeeded?`${data.writtenReviewNeeded===1?'1 réponse écrite à revoir. ':data.writtenReviewNeeded+' réponses écrites à revoir. '}`:''}Tu peux enregistrer le détail pour le suivi.`;const labels={'FR-G09-PP':'Pronoms personnels','FR-G07-GN-S':'Groupes nominaux simples','FR-G07-GN-C':'Groupes nominaux complexes'};for(const r of responses)if(r.subskillId&&r.skill)labels[r.subskillId]=r.skill;$('breakdown').replaceChildren(...Object.entries(data.bySubskill).map(([id,s])=>{const p=document.createElement('p');p.textContent=`${labels[id]||id} : ${s.correct}/${s.total}`;return p}));$('report').textContent=JSON.stringify(data,null,2);}
function reportFilename(){const safe=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,40);const d=new Date(),n=x=>String(x).padStart(2,'0');return `${safe(quiz.id)}_${localDate(d)}_${n(d.getHours())}-${n(d.getMinutes())}-${n(d.getSeconds())}.json`;}
function download(){const data=new Blob([$('report').textContent],{type:'application/json'}),link=document.createElement('a');link.href=URL.createObjectURL(data);link.download=reportFilename();link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
function emailReport(){
  const data=JSON.parse($('report').textContent);
  const recipient='nilsmyszkowskiscience@gmail.com';
  const subject=`Rapport ${data.quizId} — ${data.dateLocal} — ${data.initialCorrect}/${data.total}`;
  const body=`Rapport complet du quiz (JSON)\r\n\r\n${JSON.stringify(data)}`;
  const url=`mailto:${recipient}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  $('copyStatus').textContent='Le brouillon est ouvert dans ton application mail. Vérifie que le rapport est complet, puis appuie sur Envoyer. Si aucun brouillon ne s’ouvre, utilise « Copier le rapport » ou « Télécharger le rapport JSON ».';
  window.location.href=url;
}
async function saveToFolder(){
  if(typeof window.showDirectoryPicker!=='function'){$('copyStatus').textContent='Ce navigateur ne permet pas l’enregistrement direct. Télécharge le JSON, puis place-le dans le dossier de ton choix.';return;}
  try{
    const folder=await window.showDirectoryPicker({mode:'readwrite'});
    const name=reportFilename(),file=await folder.getFileHandle(name,{create:true}),writer=await file.createWritable();
    await writer.write($('report').textContent);await writer.close();
    $('copyStatus').textContent=`Rapport enregistré : ${name}. Tu peux retrouver ce rapport dans le dossier choisi.`;
  }catch(err){$('copyStatus').textContent=err.name==='AbortError'?'Enregistrement annulé.':`Enregistrement impossible (${err.message}). Utilise « Télécharger le rapport JSON ».`;}
}
$('start').onclick=()=>{const selected=quizzes[Number($('quizSelect').value)],count=Number($('questionCount').value),written=$('formatSelect').value==='written'&&writtenIds.has(selected.id);quiz=validate(written?{...selected,responseFormat:'written',questions:writtenQuestions(selected.id,count)}:selected===fullQuiz?{...fullQuiz,questions:generatedQuestions(count)}:selected===frenchQuiz?{...frenchQuiz,questions:frenchQuestions(count)}:mathUnits.includes(selected)?{...selected,questions:['MA-N02','MA-N03','MA-N04','MA-N05'].includes(selected.id)?mathQuestions(selected.id,count):nextMathQuestions(selected.id,count)}:extraUnits.includes(selected)?{...selected,questions:extraQuestions(selected.id,count)}:selected);index=0;responses=[];immediateFeedback=$('immediate').checked;soundEnabled=$('sound').checked;if(soundEnabled){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(AudioContextClass){audioContext ||= new AudioContextClass();audioContext.resume().catch(()=>{});}}startedAt=new Date().toISOString();show('play');render()};
$('unknown').onclick=()=>select(null);
$('textAnswer').oninput=()=>{if(answered)return;const value=$('textAnswer').value;selectedChoice=value.trim()?value:undefined;$('unknown').classList.remove('selected');$('unknown').setAttribute('aria-pressed','false');$('confirm').disabled=!value.trim();};
 $('textAnswer').onkeydown=e=>{if(e.key==='Enter'&&!$('confirm').disabled){e.preventDefault();submit()}};
$('confirm').onclick=submit;
$('next').onclick=()=>{index++;if(index<quiz.questions.length)render();else finish()};
$('cancel').onclick=()=>{if(!window.confirm('Es-tu sûr de vouloir annuler ce quiz ? Les réponses de cette tentative ne seront pas enregistrées.'))return;quiz=undefined;responses=[];index=0;selectedChoice=undefined;show('setup')};
$('again').onclick=()=>show('setup');$('download').onclick=download;$('email').onclick=emailReport;
$('saveFolder').onclick=saveToFolder;
$('subjectSelect').onchange=renderSelect;
$('quizSelect').onchange=()=>{renderFormats();renderQuestionCounts();renderQuizStatus()};
$('formatSelect').onchange=renderQuestionCounts;

$('chooseSuggestion').onclick=()=>{const q=suggestedQuiz();if(!q)return;$('subjectSelect').value=q.subject||'Autres';renderSelect();$('quizSelect').value=String(quizzes.indexOf(q));renderFormats();renderQuestionCounts();renderQuizStatus();};
$('chooseSubjectSuggestion').onclick=()=>{const q=suggestedInSubject();if(!q)return;$('quizSelect').value=String(quizzes.indexOf(q));renderFormats();renderQuestionCounts();renderQuizStatus();};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('report').textContent);$('copyStatus').textContent='Rapport copié.'}catch{$('copyStatus').textContent='Copie indisponible ici : utilise le téléchargement JSON.'}};
$('loadQuiz').onchange=async e=>{try{const q=validate(JSON.parse(await e.target.files[0].text()));quizzes.push(q);renderSubjects();$('subjectSelect').value=q.subject||'Autres';renderSelect();$('quizSelect').value=String(quizzes.length-1)}catch(err){alert(`Import impossible : ${err.message}`)}e.target.value=''};
renderSubjects();
