      if(kind===0){const place=ce2&&k%2===0?1000:100,digit=place===1000?m:h,name=place===1000?'milliers':'centaines';prompt=`Dans ${fmt(n)}, que vaut le chiffre des ${name} ?`;pick(fmt(digit*place),[fmt(digit),fmt(digit*10),fmt(digit*(place===1000?100:1000))]);explanation=`Le chiffre des ${name} est ${digit} : il vaut ${fmt(digit*place)}.`;skill='Valeur de position';}

$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('report').textContent);$('copyStatus').textContent='Rapport copié.'}catch{$('copyStatus').textContent='Copie indisponible ici : utilise le téléchargement JSON.'}};
$('loadQuiz').onchange=async e=>{try{const q=validate(JSON.parse(await e.target.files[0].text()));quizzes.push(q);renderSubjects();$('subjectSelect').value=q.subject||'Autres';renderSelect();$('quizSelect').value=String(quizzes.length-1)}catch(err){alert(`Import impossible : ${err.message}`)}e.target.value=''};
renderSubjects();


// The public-site variant sends only after an explicit click. No child identity is embedded.
document.getElementById('sendReport').onclick = async () => {
  const button = document.getElementById('sendReport');
  const status = document.getElementById('copyStatus');
  if (!quiz || !responses.length) return;
  const detectedForm = document.querySelector('form[name="education-quiz-results"]');
  if (!detectedForm || detectedForm.hasAttribute('data-netlify')) {
    status.textContent = 'Le formulaire Netlify n’est pas encore activé sur ce site. Télécharge le rapport JSON pour le conserver.';
    return;
  }
  button.disabled = true;
  status.textContent = 'Envoi du rapport…';
  try {
    const data = JSON.parse(document.getElementById('report').textContent);
    const fields = new URLSearchParams({
      'form-name': 'education-quiz-results',
      'bot-field': '',
      'quiz_id': data.quizId,
      'completed_at': data.completedAt,
      'score': `${data.initialCorrect}/${data.total}`,
      'report': JSON.stringify(data)
    });
    const response = await fetch(window.location.pathname, {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: fields.toString()
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    status.textContent = 'Envoi accepté par Netlify. Tu peux aussi télécharger le rapport JSON.';
    button.textContent = 'Rapport envoyé';
  } catch (error) {
    status.textContent = `Envoi impossible (${error.message}). Télécharge le rapport JSON pour le conserver.`;
    button.disabled = false;
  }
};
</script></body></html>
